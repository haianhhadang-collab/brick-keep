name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest has the Android SDK preinstalled (ANDROID_HOME); Gradle fetches anything missing
      - name: Build APK (release, signed with the debug key)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk ../BrickKeep.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrickKeep-apk
          path: BrickKeep.apk
      - name: Attach APK to release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BrickKeep.apk
